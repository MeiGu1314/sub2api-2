# pnpm 10+ 起，overrides 从此文件的顶层字段读取；
# package.json 的 "pnpm.overrides" 字段已不再生效（pnpm 11 会直接忽略）。
# 这里的值与 pnpm-lock.yaml 的 overrides 段保持一致。
overrides:
  js-cookie: 3.0.7
  form-data@<4.0.6: '>=4.0.6'
  postcss@<8.5.18: '>=8.5.18'
  dompurify@<3.4.17: '>=3.4.17'
  source-map-js@<1.2.2: '>=1.2.2'
  follow-redirects@<1.16.2: '>=1.16.2'
  decode-uri-component@<0.5.1: '>=0.5.1'

# pnpm 10+ 需显式批准依赖的构建脚本（此处 esbuild / vue-demi 为已知安全）
onlyBuiltDependencies: esbuild

verifyDepsBeforeRun: false
